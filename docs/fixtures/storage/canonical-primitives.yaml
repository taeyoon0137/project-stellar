# 규칙은 docs/architecture/storage-canonical-primitives.md 참조.
# 스키마 검사: cargo xtask validate-storage-fixtures
# encoder(V.1.2)·float 정책(V.1.4)은 이 golden bytes와 일치해야 합니다.

