# 제품 workspace (II.1.2).
# 현재 member는 tools/xtask 하나뿐입니다. 기능 crate는 Phase II.2에서 추가합니다.
[workspace]
resolver = "2"
members = ["tools/xtask", "crates/core-types", "crates/document", "crates/commands", "crates/history", "crates/expressions", "crates/bindings", "crates/layout", "crates/text", "crates/scene", "crates/renderer-core", "crates/renderer-metal", "crates/renderer-d3d12", "crates/storage", "crates/project", "crates/assets", "crates/dependencies", "crates/semantic-diff", "crates/semantic-merge", "crates/git-porcelain", "crates/target-profile", "crates/accessibility", "crates/diagnostics", "crates/ffi", "tools/stellar-cli", "tools/stellar-mcp", "crates/local-ipc", "crates/runtime", "crates/export", "crates/terminal", "benchmarks/fixtures", "tests/integration"]

# 공통 package metadata. member는 `<field>.workspace = true`로 상속할 수 있습니다.
[workspace.package]
edition = "2021"
rust-version = "1.96.0"
repository = "https://github.com/taeyoon0137/project-stellar"

# 공통 lint. member는 `[lints] workspace = true`로 적용합니다.
[workspace.lints.rust]
# lint 그룹은 개별 lint보다 낮은 priority여야 합니다.
unused = { level = "warn", priority = -1 }
# unsafe fn 내부의 unsafe 연산은 명시적 unsafe 블록을 요구합니다(II.1.4).
unsafe_op_in_unsafe_fn = "deny"
# 공개 API 문서 누락은 초기에는 경고로 둡니다(II.1.4).
# 내부 도구 crate(xtask)는 공개 API가 아니므로 crate 수준에서 allow 합니다.
missing_docs = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
# panic 정책(II.1.3): release는 abort. 테스트는 profile.test(unwind)를 사용합니다.
# 자세한 내용은 docs/architecture/panic-policy.md 참조.
panic = "abort"

# host 산출물(build script·proc-macro와 그 의존성)은 release에서도 strip하지 않습니다(XVI.9.1 후속).
# macOS에서 MACOSX_DEPLOYMENT_TARGET이 12.0 이상이면 proc-macro dylib이 chained fixups로 링크되고, 기본 strip(debuginfo)이
# 그 dylib를 깨뜨려 새 target에서 rustc가 proc-macro를 읽지 못합니다(E0463). 앱에 링크되는 산출물은 영향이 없습니다.
# Xcode phase도 같은 값을 환경 변수로 넘깁니다. 회귀 검사: scripts/macos/release_proc_macro_check.sh
[profile.release.build-override]
strip = "none"
