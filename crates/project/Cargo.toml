[package]
name = "stellar-project"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
stellar-core-types = { path = "../core-types" }
stellar-document = { path = "../document" }
stellar-storage = { path = "../storage" }
stellar-assets = { path = "../assets" }
stellar-dependencies = { path = "../dependencies" }
stellar-git-porcelain = { path = "../git-porcelain" }
# 프로젝트·시스템·외부 폰트 등록(XIII.6).
stellar-text = { path = "../text" }
# 자동 저장 dirty 판정이 완료된 document transaction과 창 history를 구분(XIII.1.2).
stellar-commands = { path = "../commands" }
stellar-history = { path = "../history" }
# 제한 YAML 매니페스트 파싱(IV.1.2). config/dependencies.yaml 승인 항목.
yaml-rust2 = "=0.11.0"

[dev-dependencies]
# 통합 테스트만 document 테스트 지원 코드(semantic snapshot 등, VI.10.4)를 씁니다.
stellar-document = { path = "../document", features = ["test-support"] }

[lints]
workspace = true
