# Git LFS 권고 정책 (XIII.7.2).
#
# git-porcelain의 LfsAdvicePolicy가 읽습니다. 형식은 `key: value` 한 줄씩만 허용합니다
# (중첩 없음). `extension`만 여러 줄 반복할 수 있습니다.
#
# 정책은 import 후 **경고만** 만듭니다. `.gitattributes`를 자동으로 바꾸지 않으며, LFS 추적은
# 사용자가 승인했을 때만 시스템 Git(`git lfs track`)으로 적용합니다(XIII.7.3).

# 이 크기(byte) 이상인 에셋은 LFS를 권고합니다(같은 크기 포함, 1 byte 작으면 권고하지 않음).
# 10 MiB는 잠정값입니다. 저장소 벤치마크(아키텍처 29.2, 42절 8번) 후 확정합니다.
size_threshold_bytes: 10485760

# 크기와 무관하게 LFS를 권고하는 저장 확장자(소문자 ASCII 영숫자, 점 없이).
# - bin: Stellar가 내용을 해석하지 않는 binary asset(XIII.5.7의 unknown media type 저장 확장자).
extension: bin
