# 렌더 적합성 허용 오차 (XI.11.2, ADR-0102 결정 6).
#
# 줄 하나 = class 하나: `<class> channel=<u8> radius=<u32> max_failures=<usize> max_shifted=<usize>`.
# - channel: 같은 위치 pixel의 채널(byte) 차이 허용값. GPU float→unorm 반올림 방향 차이 1 LSB를 기본으로 둡니다.
# - radius: structural 반경(pixel). channel을 넘은 pixel이라도 반경 안 이웃 pixel이 허용 차이 안이면 위치 어긋남(shifted)으로 봅니다.
#   정점 subpixel 반올림으로 경계 pixel 하나가 옆으로 밀리는 차이입니다.
# - max_failures: 허용 초과(shifted도 아님) pixel 수 상한.
# - max_shifted: shifted pixel 수 상한.
# fixture는 class 이름으로 고르고, `default`는 반드시 있어야 합니다.

default channel=1 radius=1 max_failures=0 max_shifted=24
# 곡선·stroke 경계(평탄화 정점이 정수가 아님): 경계 pixel이 더 많이 밀립니다.
curve channel=1 radius=1 max_failures=0 max_shifted=64
# blend mode: 8-bit backdrop 양자화(1 LSB)가 비연관 나눗셈·곱으로 2 LSB까지 커질 수 있습니다.
blend channel=2 radius=1 max_failures=0 max_shifted=24
# bilinear sampling: GPU filter 가중치 정밀도(8-bit subtexel) 차이.
filtered channel=3 radius=1 max_failures=0 max_shifted=16
# gradient: 1024 texel ramp texture 보간과 정확한 수식의 차이.
gradient channel=2 radius=1 max_failures=0 max_shifted=64
# blur·shadow: half float layer 저장과 GPU exp 근사.
blur channel=2 radius=1 max_failures=0 max_shifted=32
