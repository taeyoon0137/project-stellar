[package]
name = "stellar-plugin-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# 플러그인 코어(Phase XXI, ADR-0097): `.stellar-plugin` package·`plugin.yaml` 검증, 적재 gate, versioned Host API
# IDL과 생성 binding, async·batch RPC 코어. WebView·셸 연결은 두지 않습니다.
# 허용 직접 의존: ops(Host API가 부르는 L1 공용 진입점), project(제한 YAML loader 재사용), storage(package digest), git-porcelain(Git 신뢰 gate).
[dependencies]
stellar-ops = { path = "../ops" }
stellar-project = { path = "../project" }
# package digest(`ContentHash`, ADR-0004).
stellar-storage = { path = "../storage" }
# Git 신뢰 gate(`GatedGitRunner`): session이 이미 확인한 신뢰로 `ops::git::GitSession`을 엽니다.
stellar-git-porcelain = { path = "../git-porcelain" }

[features]
# 테스트 fixture(임시 신뢰 프로젝트)를 상위 crate 테스트에 노출합니다. 기본값은 꺼져 있습니다.
test-support = ["stellar-ops/test-support"]

[dev-dependencies]
stellar-ops = { path = "../ops", features = ["test-support"] }

[[bin]]
# IDL(`schemas/plugin-host-api.idl.json`)에서 TypeScript·Rust binding을 다시 씁니다(XXI.4.1).
name = "stellar-plugin-bindgen"
path = "src/bin/bindgen.rs"

[lints]
workspace = true
