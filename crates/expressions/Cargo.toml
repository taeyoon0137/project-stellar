[package]
name = "stellar-expressions"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
stellar-core-types = { path = "../core-types" }

[features]
# 테스트 전용 지원 코드(`test_support`): 다른 crate가 따로 보관하는 같은 상수를 정책 밖 통합 테스트가
# 대조할 때 씁니다. 기본값은 꺼져 있어 프로덕션 빌드에 포함되지 않습니다. 다른 crate는
# `[dev-dependencies]`에서만 켭니다.
test-support = []

[lints]
workspace = true
