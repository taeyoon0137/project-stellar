[package]
name = "stellar-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# 앱 프로세스 runtime(ADR-0013). 외부 의존성 없이 표준 라이브러리 thread·동기화만 사용합니다.
[dependencies]
stellar-assets = { path = "../assets" }
stellar-core-types = { path = "../core-types" }
stellar-document = { path = "../document" }
# 창별 편집 session(XII.2.1): 문서 state·command 실행과 창별 history.
stellar-commands = { path = "../commands" }
stellar-history = { path = "../history" }
# 프로젝트 열기(probe·identity, IV.2~IV.5)를 document thread에서 실행합니다.
stellar-project = { path = "../project" }
# 창 session의 generation 로드·저장(V.4·V.5, XII.2.1).
stellar-storage = { path = "../storage" }
# thread 역할 표시(XI.7.1)를 runtime이 만드는 thread에 bind합니다.
stellar-renderer-core = { path = "../renderer-core" }
# 창 session viewport → scene camera 입력(XII.4.3, ADR-0028).
stellar-scene = { path = "../scene", features = ["document"] }
# canvas Text의 layout·glyph outline·caret을 공통 text 엔진으로 계산합니다(ADR-0013, ADR-0067).
stellar-text = { path = "../text" }
# 선택 staging 후보의 저장 직렬화와 실제 Git 읽기 조합(XIV.5.5, ADR-0013).
stellar-ops = { path = "../ops" }
stellar-git-porcelain = { path = "../git-porcelain" }
# 내장 에이전트 세션 시작 확인·승인 요청·채팅 조립(ADR-0005 §8, ADR-0101): 신뢰 capability 판정과 프로젝트 identity를 연결합니다.
stellar-agent-host = { path = "../agent-host" }
# 앱 쪽 에이전트 편집 구현(XXIX.3.1, ADR-0112): 창별 권한·lease 요청·출처 색인·종료 절차·되돌리기를 창 history에 연결합니다.
stellar-agent-edit = { path = "../agent-edit" }

[dev-dependencies]
stellar-text = { path = "../text", features = ["test-support"] }
# 테스트만 문서 semantic snapshot(VI.10.4 test-support)을 씁니다.
stellar-document = { path = "../document", features = ["test-support"] }
stellar-ops = { path = "../ops", features = ["test-support"] }
stellar-git-porcelain = { path = "../git-porcelain", features = ["test-support"] }

[lints]
workspace = true
