[package]
name = "stellar-ffi"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
# C 테스트·네이티브 셸 링크용 staticlib와 일반 lib를 함께 생성합니다.
crate-type = ["lib", "staticlib"]

[dependencies]
stellar-core-types = { path = "../core-types" }
# 셸 경계는 문서·프로젝트 작업에 runtime을 통해서만 도달합니다(ADR-0013, ADR-0014).
stellar-runtime = { path = "../runtime" }

[lints]
workspace = true
