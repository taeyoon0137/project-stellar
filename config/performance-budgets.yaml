# Project Stellar 성능·정확도 예산.
#
# 작업별로 필요한 항목을 추가합니다. 이 파일은 ADR 보호 경로이며(I.3.5),
# 변경 시 같은 diff에 ADR이 있어야 CI(check-adr-policy)를 통과합니다.
#
# 현재 항목:
#   color: 색공간 transfer 함수(encode/decode) 정확도 예산 (III.4.2 / ADR-0002)
#   storage: chunk 분할 임계치 (V.6.4 / ADR-0012)
#   autosave: 지연 자동 저장 시점과 flush 제한 시간 (XIII.1.1 / ADR-0072)
# 추후 항목:
#   T0~T5 상호작용 타이밍 예산은 XVI.4.1에서 같은 파일에 추가됩니다.

color:
  # sRGB 계열 transfer 함수의 reference 대비 및 encode↔decode round-trip 절대 오차
  # 상한입니다(정규화 채널 값 기준). 8-bit 양자화(1/255 ≈ 3.9e-3)보다 충분히 작습니다.
  # 근거와 transfer 곡선 선택: ADR-0002.
  transfer_abs_tolerance: 1.0e-5

storage:
  # chunk 분할 임계치(bytes) = 256 KiB. envelope 비압축 payload 길이(ADR-0010) 기준이며,
  # 의미 경계로 나눈 chunk의 payload가 이 값을 넘으면 split planner(V.6.4)가 분할합니다.
  # idle chunk 병합(V.6.5)은 병합 결과가 이 값 이하일 때만 합칩니다(별도 병합 수치 없음).
  # 근거: ADR-0012. reader(stellar-storage `chunk::budget`)는 이 절을 엄격하게 검사합니다.
  # 값은 10진 양의 정수만 허용합니다(밑줄·단위·선행 0 금지).
  chunk_split_threshold_bytes: 262144

autosave:
  # 지연 자동 저장(기술 아키텍처 22.1). 근거와 측정: ADR-0072. 값은 잠정이며 사용성·SSD 쓰기·복구 손실
  # 범위 벤치마크로 다시 정합니다. reader(stellar-project `autosave`)는 누락·범위 밖 값을 거부합니다.
  # 마지막 완료 편집 뒤 저장까지 기다리는 시간.
  debounce_ms: 1000
  # 완료 편집이 계속 이어져도 저장되지 않은 첫 편집에서 이 시간이 지나면 저장합니다(drag·scrub 제스처 중은 제외).
  max_delay_ms: 10000
  # 앱 비활성화 flush 제한 시간. 아직 쓰지 않습니다(XIII.1.6). 비활성화 flush는 셸을 기다리게 하지 않습니다.
  app_deactivate_flush_timeout_ms: 2000
  # 창 닫기 flush 제한 시간. Save Now(창 닫기 flush)가 진행 중인 자동 저장 쓰기를 기다리는 상한이고, 넘으면 저장
  # 실패를 돌려줍니다. macOS 셸의 닫기 응답 watchdog(closeReplyTimeout)은 셸 값이며 이 값을 읽지 않습니다(XIII.1.6).
  window_close_flush_timeout_ms: 10000
