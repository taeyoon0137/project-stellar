[package]
name = "stellar-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# 사용자가 부르는 명령 이름은 `stellar`입니다(XXIV.4.1, ADR-0005 §2). package·library 이름은
# `stellar-cli`로 유지하고 실행 파일 이름만 정합니다. 결과 JSON schema 식별자는 바꾸지 않습니다.
[[bin]]
name = "stellar"
path = "src/main.rs"

# L1 headless 도구(XXIV.1.1): 앱 UI·GUI·네트워크 없이 L1 공용 library만 사용합니다.
# 직접 의존은 stellar-ops·diagnostics뿐입니다(ADR-0005 §8, XXIV.4.3).
# AI·MCP·모델·agent 관련 crate와 외부 crate를 직접 의존성으로 두지 않습니다.
[dependencies]
# 프로젝트 검사·조회(`inspect`, `query`): probe, snapshot, 문서 트리, node 속성.
stellar-ops = { path = "../../crates/ops" }
# 로컬 진단 store·번들·scanner·동의(`diagnostics`, XVI.8).
stellar-diagnostics = { path = "../../crates/diagnostics" }

[dev-dependencies]
# 통합 테스트가 저장된 프로젝트 fixture를 만들 때만 씁니다(ops test-support).
stellar-ops = { path = "../../crates/ops", features = ["test-support"] }

[lints]
workspace = true
