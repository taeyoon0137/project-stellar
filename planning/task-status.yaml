  - id: "IX.11.6"
    title: "레이아웃 container·item 속성을 CSS longhand로 저장하는 영속 record와 schema version을 정의합니다. 생략값은 CSS initial value입니다. 저장 위치(Frame payload 확장 또는 `layout_mode` 참조 resource)와 Frame `size` 흡수 방식을 이 작업의 ADR로 정합니다. longhand key는 ADR-0024 결정 14로 할당하고, schema version 증가는 IX.11.21이 정한 묶음 규칙을 따릅니다."
    status: not_started
    depends_on:
