  - id: "XXIX.2.6"
    title: "CLI 종류와 지원 버전 범위별 launch profile을 Stellar 소유 fixture로 관리합니다. 각 profile은 각 CLI 공식 문서의 비대화형 인터페이스와 구조화 출력 형식만 쓰고, 실행 설정, decoder profile 버전, CLI 프로세스에 전달할 환경 변수 이름 목록(ADR-0023 결정 9), 공급자 약관·공식 문서 검토 일자와 결과를 담습니다. 환경 변수 목록에는 이름만 적고 값은 넣지 않으며, 각 이름을 넣은 근거(CLI 공식 문서의 해당 항목)를 profile별 보고서에 기록합니다. profile은 ADR-0005 §4.3 두 불변식을 지키며, 각 불변식을 지키는 공식 설정과 그 밖의 실행 세부는 각 CLI 공식 문서와 Apple 공식 문서를 근거로 profile별 보고서에 기록합니다. 약관 검토상 허용이 명확하지 않은 CLI와 지원 범위 밖 버전은 실행하지 않습니다."
    status: not_started
    depends_on:
