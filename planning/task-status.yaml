      - "XII.4.4"
    required_environments:
      - DEV-MAC
  - id: "XII.10.8"
    title: "변형 핸들 hit layer를 구현합니다. 모서리·변 크기 핸들, 모서리 바깥 회전 영역, 모서리 안쪽 반경 핸들, padding·gap 핸들 자리의 우선순위(반경, 크기, padding·gap, 회전, 본체 순)와 작은 선택에서 핸들을 숨기는 규칙을 구현하고, 회전된 node는 local 좌표로 계산합니다."
    status: not_started
    depends_on:
      - "XI.3.5"
      - "XII.4.4"
    required_environments:
      - DEV-MAC
  - id: "XII.10.9"
    title: "크기 조절 제스처를 구현합니다. Shift는 비율 유지(비율 고정 속성이 켜져 있으면 일시 해제), Option은 중심 기준, 반대편을 넘으면 뒤집기(Text는 0에서 멈춤), 다중 선택은 선택 bounds 기준 비례 배치입니다. 흐름 컨테이너 자식은 조절한 축을 Fixed preset으로 바꾸고 변 핸들 더블클릭은 그 축을 HugContent preset(`width: fit-content` 등)으로 바꾸며, preset과 longhand 변환은 IX.11.7 함수를 씁니다. 크기 longhand는 IX.11.6 영속 record와 IX.11.3 Shape·Image·Text PropertyKey로 씁니다. 속성 이름과 저장 필드 대응은 `docs/design/property_model.md`를 따르며 pointer up에서 CommandTransaction 하나를 확정합니다."
    status: not_started
    depends_on:
      - "XII.10.8"
      - "XII.3.7"
      - "VII.4.2"
      - "XII.10.2"
      - "IX.11.3"
      - "IX.11.6"
      - "IX.11.7"
    required_environments:
      - DEV-MAC
  - id: "XII.10.10"
    title: "회전 제스처를 구현합니다. pivot은 단일 선택이면 node border box 중심, 다중 선택이면 선택 bounds 중심이고 Shift는 15도 단위입니다. 결과는 `rotate` 편집(`docs/design/property_model.md`)이며 제스처는 저장된 `transform-origin`을 바꾸지 않습니다. 저장된 origin이 pivot과 다르면(IX.11.9 migration 노드의 `0 0` 등) pivot의 world 위치가 그대로 남도록 위치를 보정합니다. 위치 지정 자식은 현재 anchor의 inset, 흐름 자식은 `translate`를 바꿉니다. 다중 선택은 각 node의 위치와 `rotate`를 함께 바꿉니다. 회전 중심 이동 핸들 제공 여부(캔버스 명세 C3)를 이 행에서 정하고, 핸들을 두면 그 핸들만 `transform-origin`을 바꾸며 같은 보정으로 외형을 유지합니다."
    status: not_started
    depends_on:
      - "XII.10.8"
      - "XII.10.2"
      - "IX.11.9"
    required_environments:
      - DEV-MAC
  - id: "XII.10.11"
    title: "모서리 반경 핸들을 Frame·Rectangle·Polygon에 구현합니다. 드래그는 네 모서리 동시, Option은 그 모서리만 바꾸고, bounds를 넘는 값은 VI.5.2 평가 규칙으로 표시만 줄이며 저장값은 입력값을 유지합니다. 반경은 4 모서리 `border-*-radius` longhand key로 씁니다. Frame key는 IX.11.22가 `corner_radius`(0x0106)를 나눠 만들고, Rectangle·Polygon key는 IX.11.3이 만듭니다(ADR-0024 결정 14)."
    status: not_started
    depends_on:
