  - id: "XXX.7.3"
    title: "ReferenceTarget에 Context 종류를 IX.12.1이 예약한 tag로 추가하고 binding dependency graph가 ContextKey와 ContextProvision을 공통 node로 표현하게 합니다. 기존 ReferenceTarget tag(`crates/expressions/src/ast.rs`의 Token·Property·ComponentProperty·Environment)와 bytes는 바꾸지 않습니다."
    status: not_started
    depends_on:
      - "XXX.7.2"
      - "VIII.6.2"
    required_environments:
      - DEV-MAC
  - id: "XXX.7.4"
    title: "Context 해석기를 구현합니다. instance expansion view의 펼친 트리에서 소비 지점의 가장 가까운 조상 provision을 쓰고, 없으면 key default를 씁니다. provision 값 식이 같은 key를 읽으면 바깥 조상 값으로 해석합니다. slot 콘텐츠는 작성 scope 기준으로 해석합니다. slot host에 이르면 컴포넌트 내부 조상을 건너뛰고 instance node로 이어 올라가며, Slot 공개 목록에 있는 key만 slot host부터 컴포넌트 내부 조상 provision을 찾습니다(ADR-0025 결정 3.11). 조상 탐색 결과는 runtime index로 캐시합니다."
    status: not_started
    depends_on:
      - "XXX.7.3"
      - "IX.2.2"
      - "IX.3.2"
    required_environments:
      - DEV-MAC
  - id: "XXX.7.5"
    title: "Context validator를 구현합니다. ComponentDefinition 안의 선언 없는 소비(그 정의가 작성한 slot 콘텐츠 안의 소비 포함)와 타입 불일치는 오류, 존재하지 않는 key의 provision과 Slot 공개 목록 항목은 orphan, 쓰지 않는 requirement는 경고, default 해석과 shadowing은 정보 진단입니다. 서로 다른 key가 서로를 읽는 cycle은 binding cycle detector로 저장 전 거부합니다."
    status: not_started
    depends_on:
      - "XXX.7.4"
      - "VIII.6.3"
    required_environments:
      - DEV-MAC
  - id: "XXX.7.6"
    title: "Context 해석 결과를 바꾸는 변경에서 영향받는 소비 binding만 topological order로 재평가하도록 binding scheduler에 연결합니다. 무효화 조건은 provision 추가·삭제·값 변경, ContextKey default 변경, 소비 node나 그 조상의 reparent·이동·삭제, instance의 ComponentRef 교체, slot 콘텐츠 삽입·삭제·재정렬, Slot 공개 목록 변경, View Variant 구조 patch(node add·delete·move·replace, slot change)의 적용·해제, Fragment 묶기·풀기입니다."
    status: not_started
    depends_on:
      - "XXX.7.4"
      - "VIII.6.4"
      - "IX.7.3"
    required_environments:
      - DEV-MAC
