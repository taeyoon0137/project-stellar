  - id: "XII.10.3"
    title: "클릭 선택을 구현합니다. hit test 결과를 현재 편집 범위(Editing Scope)의 직계 자식까지 올려 선택하고, Shift-클릭은 토글 추가, 빈 곳 클릭과 Escape는 선택 해제, ⌘A는 편집 범위 형제 전체 선택입니다. Fragment는 묶음 단위, ComponentInstance는 한 덩어리로 선택하고 결과는 SetSelection 하나입니다."
    status: not_started
    depends_on:
      - "XI.3.4"
      - "VII.3.2"
      - "XII.10.1"
    required_environments:
      - DEV-MAC
  - id: "XII.10.4"
    title: "깊은 선택과 편집 범위 이동을 구현합니다. ⌘-클릭은 가장 깊은 선택 가능 node, 더블클릭·Return은 한 단계 아래, Shift-Return은 부모, Tab·Shift-Tab은 OrderKey 순 형제 이동, Shift-더블클릭은 깊은 node 추가입니다. 편집 범위는 WindowViewState에 두고, 선택이 범위 밖으로 나가면 선택의 가장 가까운 공통 조상으로 다시 맞춥니다."
    status: not_started
    depends_on:
      - "XII.10.3"
    required_environments:
      - DEV-MAC
  - id: "XII.10.5"
    title: "select-through 규칙을 구현합니다. pointer down이 현재 선택 bounds 안이면 위에 다른 node가 있어도 드래그는 선택을 옮기고, 움직이지 않고 놓으면 그 위치를 클릭 규칙으로 선택합니다. 잠금·숨김 node는 캔버스 hit에서 통과시키고, 커서 아래 겹친 node 목록(잠금 포함, z 역순)을 문맥 메뉴의 겹친 레이어 고르기 하위 메뉴(Select Overlapping, 캔버스 명세 4.3절)용으로 반환합니다."
    status: not_started
    depends_on:
      - "XII.10.3"
      - "XI.3.3"
    required_environments:
      - DEV-MAC
  - id: "XII.10.6"
    title: "영역 선택(마퀴)을 구현합니다. 빈 캔버스나 Root Frame 빈 영역에서 시작하고, 기본은 영역에 걸친 편집 범위 node, Option은 완전히 포함된 node, ⌘는 가장 깊은 node, Shift는 기존 선택에 더하기(AreaSelectionMode Add)입니다. 진행 중 결과는 transient preview이고 pointer up에서 SetSelection 하나만 만듭니다."
    status: not_started
    depends_on:
      - "VII.3.3"
      - "XII.10.3"
      - "XI.3.1"
    required_environments:
      - DEV-MAC
  - id: "XII.10.7"
    title: "hover 미리보기를 구현합니다. 지금 클릭하면 선택될 node(누른 수식키 반영)의 윤곽을 transient overlay로 그리고, 사이드바 레이어 행 hover와 캔버스 hover를 같은 hover 상태로 동기화합니다. hover는 history·저장 대상이 아닙니다."
    status: not_started
    depends_on:
