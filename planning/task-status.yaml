  - id: "XXIX.2.9"
    title: "출력 디코더 테스트 fixture를 launch profile마다 둡니다. 원문 입력과 기대 `AgentChatItem` 목록(golden)으로 네트워크와 실제 계정 없이 결정적으로 실행하며(아키텍처 38), fixture에는 XVI.8 금지 정보를 넣지 않습니다. 정상 출력, 해석할 수 없는 출력, 입력 경계에 걸친 데이터를 포함하고, profile별 사례는 각 CLI 공식 문서를 근거로 보고서에 기록합니다."
