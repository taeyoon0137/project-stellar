  - id: "XXIX.3.1"
    title: "FFI를 확장합니다. 에이전트 세션 생성·메시지 전송·중지, 승인 응답, 채팅 item과 원문 버퍼 증분 event, 출처 색인 조회, 변경·세션 되돌리기와 표시 정리 함수, 버전이 매겨진 에이전트 event message를 추가하고 셸은 II.4.5 pull 방식 event 경로로 받습니다. stellar-ffi 허용 의존은 ADR-0013대로 core-types, runtime만 두고, 에이전트 기능은 runtime을 거쳐 도달합니다. crate graph 정책의 stellar-runtime 허용 의존에 agent-host, agent-protocol, ops와 에이전트 편집 구현 crate를 추가하고, runtime이 agent-protocol host trait를 구현합니다(ADR-0005 §8). FFI는 보호 경로이므로 같은 변경에 ADR을 갱신합니다."
