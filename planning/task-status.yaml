    title: "대화형 terminal session의 child 환경을 ADR-0023에 맞춥니다. 이 행은 완료 행 XVIII.1.1이 정의한 \"environment allowlist\"(구현 타입 `EnvironmentPolicy`, `crates/terminal/src/env.rs`)를 대화형 세션에 대해 대체하며, XVIII.1.1 문구와 상태는 그대로 둡니다(ADR-0023 Consequences). spawn 경로에서 `env_clear`와 상속 허용 목록(`DEFAULT_INHERITED_ENV`)을 제거하고 앱 프로세스 환경을 그대로 물려준 뒤, 터미널 식별 변수 `TERM`·`COLORTERM`·`TERM_PROGRAM`·`TERM_PROGRAM_VERSION`을 설정하고 profile 명시 지정을 마지막에 적용합니다. 식별 변수 값은 spawn 입력으로 받으며 `TERM`·`COLORTERM` 값은 XVIII.4.1이 emulator에 맞춰 확정합니다. 그 밖의 변수는 추가하지 않고 사용자 셸 설정 파일을 만들거나 고치지 않습니다. 허용 목록 환경은 agent CLI 실행기(XXIX.2.4, ADR-0023 결정 9)에만 둡니다."
