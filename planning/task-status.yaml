  - id: "IX.11.4"
    title: "layout 엔진 Stack 의미를 CSS Flexbox에 맞춥니다. `flex-shrink` 기본 1, `align-items`·`align-content` 생략값 `normal`(stretch), 자식별 `align-self`, 축 고정 `row-gap`·`column-gap` 입력을 구현합니다. flex item 자동 최소 크기는 IX.11.23이 맡습니다. 바뀐 X.11.1 corpus 기대값은 네 변경별로 나눠 fixture별 변경 이유와 함께 갱신합니다."
    status: not_started
    depends_on:
      - "IX.11.1"
      - "X.3.5"
      - "X.6.4"
    required_environments:
      - DEV-MAC
  - id: "IX.11.5"
    title: "Grid·Free·Overlay 의미를 CSS에 맞춥니다. grid item 생략 정렬을 `normal`(stretch)로 하고 `justify-self`·`align-self`를 추가합니다. track 최솟값 `auto`(item 최소 기여)를 추가해 bare `fr`을 CSS `minmax(auto, <n>fr)`로 해석하고, 기존 `TrackSize::Fraction`은 `minmax(0, <n>fr)`과 같게 둡니다. Free containing block을 padding box로 바꾸고 백분율 위치·크기의 기준도 content rect(X.2.3)에서 padding box로 바꾸며, anchor 없는 축은 시작 anchor 0으로 해석합니다. absolute 자식이 부모 Hug 크기에 기여하지 않게 합니다. Overlay 정렬 이름을 `justify-items`·`align-items`로 맞추고 생략값을 CSS initial value(`normal`, stretch)로 바꿉니다. 영속 record 생략값은 CSS initial value, 새 노드 생성 preset은 명시 값입니다."
    status: not_started
    depends_on:
      - "IX.11.1"
      - "X.2.3"
      - "X.4.5"
      - "X.5.1"
      - "X.6.5"
    required_environments:
