    title: "Context를 Web 출력으로 낮춥니다. CSS로 표현 가능한 스타일 값은 등록된 CSS custom property 상속으로, 그 밖의 값은 생성 코드의 context 구조로 내보냅니다(ADR-0025 결정 4.3). 등록 속성은 토큰과 같은 속성 모델 10장 정책(`inherits: true`)을 씁니다. ContextKey의 CSS 이름은 IX.11.16 파생 규칙으로 만들고, 같은 export scope의 토큰 이름·아래 깊이 이름과 한 이름 공간에서 충돌을 검사·진단합니다. 같은 key를 다시 읽는 provision은 자기 참조 `var()`로 내보내지 않습니다(CSS에서는 cycle이 되어 guaranteed-invalid 값이 됨). 대신 그 key의 provision마다 펼친 트리의 provision 깊이 d(자기를 포함한 조상 provision 수, key default는 0)를 붙인 custom property에 값을 쓰고 key 이름으로 다시 공급하며, 값 식 안의 같은 key 읽기는 깊이 d-1 이름으로 바꿉니다. 같은 provision이 instance 위치마다 다른 깊이를 가져 규칙 하나로 낼 수 없으면 그 key를 생성 코드 context 구조로 내보내고 정보 진단을 냅니다. slot host에서는 Slot이 공개하지 않았고 컴포넌트 안에 provision이 있는 key를 instance 바깥 값으로 다시 공급합니다(ADR-0025 결정 3.11)."
