  - id: "IX.11.2"
    title: "Frame·Modifier metadata registry의 모든 항목에 속성 모델 5장·9장 대응을 채웁니다. registry `name`을 CSS longhand 또는 `stellar-only` 이름으로 맞추고 semantic diff 표시 문자열을 같은 이름으로 바꿉니다. 묶음 key(IX.11.22)는 대응 longhand 목록으로 표시합니다. `clipping` 항목에는 확인된 clip 기준(border box와 바깥 corner radius, `crates/scene/src/builder.rs` `FrameClipInput::Bounds`)과 CSS 대응(`overflow: clip` + `overflow-clip-margin: border-box`)을 차이 설명으로 기록합니다."
    status: not_started
    depends_on:
