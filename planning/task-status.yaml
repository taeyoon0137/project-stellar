      - "IX.11.22"
    required_environments:
      - DEV-MAC
  - id: "IX.11.3"
    title: "Shape·Path·Text·Image property metadata registry를 Frame registry(VI.3.5)와 같은 방식으로 추가합니다. node kind 상위 byte 규칙(Frame `0x01xx`, Image `0x06xx`)으로 longhand마다 PropertyKey 하나를 할당하고(ADR-0024 결정 14) 기존 key는 재사용하지 않습니다. 각 항목에 속성 모델 6장·7장 CSS 매핑을 채웁니다. semantic snapshot이 임시로 쓰는 전용 key(`0xE3xx`·`0xE4xx`·`0xE6xx`, `crates/semantic-diff/src/keys.rs`)를 새 문서 key로 바꾸고 diff golden을 갱신합니다. Path command·point 목록과 Text content는 payload 단위 key를 유지하고, Text style longhand key는 IX.11.11이 같은 규칙으로 할당합니다(속성 모델 15장 O12)."
    status: not_started
    depends_on:
      - "IX.11.1"
      - "IX.11.22"
      - "VI.5.6"
      - "VI.6.2"
      - "VI.7.3"
      - "VI.8.1"
      - "XIV.3.1"
    required_environments:
