      - "IX.11.5"
      - "IX.11.21"
      - "IX.11.22"
      - "V.8.6"
    required_environments:
      - DEV-MAC
  - id: "IX.11.7"
    title: "sizing preset(Fixed·Percentage·HugContent·Fill)과 longhand 사이의 순수 변환 함수를 구현합니다. preset→longhand는 속성 모델 4.3절 표를 따르고, longhand→preset은 표와 정확히 일치할 때만 preset을 돌려주며 아니면 Custom입니다."
    status: not_started
    depends_on:
      - "IX.11.6"
    required_environments:
      - DEV-MAC
  - id: "IX.11.8"
    title: "CSS 레이아웃 적합성 fixture를 추가합니다. Flexbox 60개, Grid 40개, positioning 30개 이상이며 각 fixture는 CSS 선언과 기대 border box rect를 가집니다. 기대값은 Chromium 계열 고정 버전 브라우저 하나(1/64 px LayoutUnit, 속성 모델 1.3절)로 생성한 JSON을 커밋하고, 생성 절차와 브라우저 버전을 fixture README에 기록합니다. 브라우저와 생성 스크립트는 빌드·테스트 의존성이 아닌 개발 도구이며, 도입 전에 `config/dependencies.yaml` 승인 절차(계획 1장 14번)를 거칩니다. 테스트는 브라우저를 실행하지 않습니다. 텍스트는 고정 intrinsic 크기 대체 요소로 둡니다. 기본 fixture는 남는 공간이 1/64 px 격자에서 나누어떨어지는 입력만 쓰고, 잔여 분배·가운데 정렬 반올림 차이는 별도 `distribution` 묶음으로 둡니다. 두 축 indefinite `aspect-ratio`, 음수 남는 공간의 `space-around`·`space-evenly`, bare `fr`, flex item 자동 최소 크기 fixture를 포함합니다."
    status: not_started
    depends_on:
      - "IX.11.4"
      - "IX.11.5"
      - "IX.11.23"
      - "X.11.1"
    required_environments:
      - DEV-MAC
  - id: "IX.11.9"
    title: "Frame 위치와 transform 분리 migration을 IX.11.21 registry step으로 구현합니다. 행렬의 이동 성분만 위치로 옮기고 선형 부분은 `transform: matrix(a, b, c, d, 0, 0)`으로 bit 그대로 보존하며 `rotate`·`scale`로 분해해 저장하지 않습니다(ADR-0024 결정 8). 지금 저장 형식에는 layout 정의 record가 없어 모든 자식이 Free 자식이므로 이동 성분은 `left`·`top`으로 옮기고, 부모가 flow 방식인 입력이면 `translate`로 옮깁니다. migration된 노드에는 `transform-origin: 0 0`을 명시 저장하고, 새 노드 기본 origin은 `50% 50%`입니다. 새 longhand key는 ADR-0024 결정 14로 할당하고 0x0102는 묶음 key로 남기되 이 schema 이후 새 command로 받지 않습니다. 0x0102를 가리키는 저장 참조(ValueBinding target, View Variant·Component variant override property patch)는 `TypedValue`·`ExpressionType`에 Transform 타입이 없어 값 변환을 하지 않고, bytes를 보존한 채 migration 보고서와 IX.11.22 진단에 나열합니다. layout 결과 위치와 `translate`·`rotate`·`scale`·`transform`·`transform-origin`을 CSS 순서로 합성해 scene `NodeInput.transform`을 만드는 함수와 `rotate` 각도→행렬 sin·cos 구현(속성 모델 15장 O13)을 정합니다. 인스펙터 위치 X·Y 편집 경로를 새 속성으로 바꿉니다."
    status: not_started
    depends_on:
      - "IX.11.6"
      - "IX.11.21"
      - "IX.11.22"
      - "X.1.2"
      - "V.8.6"
    required_environments:
      - DEV-MAC
  - id: "IX.11.10"
    title: "Frame border를 4변 `border-*-width`·`-style`·`-color` longhand로 바꾸는 migration을 IX.11.21 registry step으로 구현합니다. 기존 `Border{color, thickness}`는 4변 같은 값과 style `solid`로, 없음은 `none`으로 옮기고, 12개 longhand에 ADR-0024 결정 14로 key를 할당하며 0x0105는 묶음 key로 남기되 이 schema 이후 새 command로 받지 않습니다. border가 CSS처럼 padding box를 줄이도록 layout 입력에 border 두께를 넣고, 화면 위치를 보존하려고 border가 있는 부모의 Free 자식 `left`·`top`에서 부모 border 두께를 뺍니다(IX.11.9 뒤 적용). 0x0105를 가리키는 저장 참조(index segment 포함)는 IX.11.9와 같은 규칙으로 값 변환 없이 보존·보고합니다."
    status: not_started
    depends_on:
      - "IX.11.6"
      - "IX.11.9"
      - "IX.11.21"
      - "V.8.6"
    required_environments:
      - DEV-MAC
  - id: "IX.11.11"
    title: "Typography record를 CSS longhand(`font-family`, `font-size`, `font-weight`, `font-style`, `font-stretch`, `line-height`, `letter-spacing`)로 정의하고 `TextStyle.typography` 참조 대상으로 연결합니다. family 해석 결과는 `FontFaceRef`로 고정하고 누락 글꼴은 진단합니다. 지금 `TextPayload`는 content와 paragraph·run의 style index만 저장하고 `TextStyle`·`ParagraphStyle` 표는 저장하지 않으므로(`crates/document/src/text.rs` `encode`), style 표 저장 형식을 이 행에서 정하고 Text payload schema 변경으로 IX.11.21 step에 넣습니다(옛 payload는 기본 style 표로 migration). `ParagraphStyle`에 문단 typography 참조(CSS의 문단 요소 자신의 `font-*`, root inline box strut의 글꼴 출처)를 추가하고, typography 없는 run은 문단 typography, 그다음 문서 기본 typography를 상속합니다(문서 기본의 저장 위치도 이 행에서 정함). `letter-spacing`은 `ParagraphStyle.letter_spacing_em`에서 run `TextStyle`의 선택 필드(없으면 Typography 값)로 옮기며 Typography resource를 복제하지 않습니다. 저장된 값이 없으므로 이 이동은 파일 migration이 아닙니다. `TypedValue::Typography` tag는 유지하고 payload를 Typography canonical encoding으로 정의하며, 새 encoding으로 decode되지 않는 기존 불투명 blob은 bytes를 보존하고 `typography-unrecognized` 진단을 냅니다. style longhand에는 ADR-0024 결정 14로 key를 할당합니다."
    status: not_started
    depends_on:
      - "IX.11.1"
      - "IX.11.21"
      - "VI.7.2"
      - "X.8.4"
    required_environments:
      - DEV-MAC
  - id: "IX.11.12"
    title: "Text paragraph 속성을 CSS에 맞춥니다. `line-height` 배율을 inline box별 font-size 기준으로 해석하도록 text layout을 고치고, root inline box strut는 문단 typography(IX.11.11)의 첫 사용 가능 글꼴과 font-size로 만듭니다. run `letter-spacing`(IX.11.11)을 text 엔진 입력에 연결합니다. style 표가 아직 저장되지 않으므로 이 행은 파일 migration을 만들지 않습니다. 바뀐 X.10 golden은 이유와 함께 갱신합니다."
    status: not_started
    depends_on:
      - "IX.11.11"
      - "IX.11.21"
      - "X.10.2"
    required_environments:
      - DEV-MAC
  - id: "IX.11.13"
    title: "registry 값 문법별 CSS 값 formatter를 구현합니다. 속성 모델 8.2절·8.3절 정규 형식(가장 짧은 왕복 10진, 소문자 keyword, 색 hex 또는 `color()`)을 따르고 토큰 참조는 `var(--name)`으로 씁니다."
    status: not_started
    depends_on:
      - "IX.11.2"
      - "IX.11.3"
    required_environments:
      - DEV-MAC
  - id: "IX.11.14"
    title: "registry 값 문법별 CSS 값 parser와 shorthand 확장을 구현합니다. 속성 모델 2장의 입력 형태만 받고 그 밖은 `unsupported-unit`·`unsupported-value`·`unknown-token`·`forbidden-value` 오류를 구조화해 반환합니다. 입력 길이 상한과 재귀 없는 문법을 지킵니다."
    status: not_started
    depends_on:
      - "IX.11.13"
    required_environments:
      - DEV-MAC
  - id: "IX.11.15"
    title: "선택 노드 속성을 CSS 선언 블록 텍스트로 복사하고, CSS 선언 블록을 붙여넣어 하나의 CommandTransaction으로 적용하는 core API를 구현합니다. 알 수 없는 속성과 받을 수 없는 값은 건너뛴 목록으로 돌려주고 조용히 버리지 않습니다. parser가 받지 않는 형태로 복사되는 값(Constraint CenterX·CenterY의 `calc(50% + <offset>)`, 속성 모델 2장·4.5절)도 건너뜀 보고 대상입니다. 클립보드 연결은 셸이 맡습니다."
    status: not_started
    depends_on:
      - "IX.11.14"
      - "IX.11.16"
      - "VII.2.4"
      - "VII.2.6"
    required_environments:
      - DEV-MAC
  - id: "IX.11.16"
    title: "TokenName과 ContextKey 이름에서 CSS custom property 이름을 결정론적으로 파생합니다. 속성 모델 10장 규칙(구분자 치환, identifier escape, 토큰 `--`·ContextKey `--context-` 접두사, 토큰과 ContextKey를 합친 집합 기준 충돌 진단, 충돌 시 StableId 32자리 hex 접미사)을 이름·종류·StableId만 받는 순수 함수로 구현하고 parser의 `var()` 해석에 연결합니다. 토큰 `@property` 선언 텍스트는 `inherits: true`로 만듭니다(10장 등록 속성 정책). ContextKey 입력은 로드맵 XXX.7.1의 `ContextKey` resource가 생기면 연결하고, 그 전에는 같은 함수에 합성 입력을 넣어 검증합니다."
    status: not_started
    depends_on:
      - "IX.11.13"
      - "VIII.5.2"
    required_environments:
      - DEV-MAC
  - id: "IX.11.17"
    title: "macOS 인스펙터 섹션을 속성 모델 12장 CSS 범주로 재구성합니다. `InspectorPropertyCatalog`와 `docs/design/ui/inspector.md`를 갱신하고, sizing preset, 4변·4모서리 묶음 편집(longhand key 변경 집합으로 적용), CSS 값 입력·오류 표시, longhand 이름 툴팁을 연결합니다. migration된 노드의 회전·배율은 `transform` 행렬에서 계산한 표시 전용 값으로 보여 주고, 그 값을 편집할 때의 규칙(행렬 갱신 또는 `rotate`·`scale` 사용)을 이 행에서 정합니다. 외형은 가이드와 인스펙터 명세를 따릅니다."
    status: not_started
    depends_on:
      - "IX.11.2"
      - "IX.11.3"
      - "IX.11.7"
      - "IX.11.9"
      - "IX.11.14"
    required_environments:
      - DEV-MAC
  - id: "IX.11.18"
    title: "modifier stack을 CSS 고정 적용 순서로 선형화하는 export 계획 함수를 구현합니다. 속성 모델 9.1절 규칙으로 요소·wrapper 구조, filter 목록, path 굽기 지점을 계산하고 wrapper마다 `approximated` 진단을 냅니다. 요소 구조에는 모든 요소가 같은 층(`z-index: 0`)의 stacking context를 만들어 DOM 순서대로 그려지게 하는 출력 규칙(속성 모델 3장, 14장 E3)을 넣습니다."
    status: not_started
    depends_on:
      - "IX.11.2"
      - "IX.10.5"
    required_environments:
      - DEV-MAC
  - id: "IX.11.19"
    title: "registry CSS 매핑과 Web·Apple·Android TargetProfile을 잇는 초기 capability matrix를 IX.10.5 registry에 등록합니다. XXII.2.2, XXII.2.3, XXII.3.2, XXII.4.2는 이 matrix를 입력으로 씁니다."
    status: not_started
    depends_on:
      - "IX.11.2"
      - "IX.11.3"
      - "IX.10.5"
    required_environments:
