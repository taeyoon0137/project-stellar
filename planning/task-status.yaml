  - id: "XXIX.2.8"
    title: "AgentSession 상태 기계를 구현합니다. 상태와 전이는 XIX.6.4 종료 절차와 아키텍처 31.5 수명 규칙을 표현하도록 이 작업에서 정해 보고서에 기록합니다. 앱이 시작한 세션의 lease와 권한은 AgentSession이 소유하고, XIX.1.8로 결합된 bridge가 다시 연결되면 같은 세션에 다시 묶으며, 재연결 유예를 둡니다. 세션은 사용자가 명시적으로 시작할 때만 만들고 사용자 동작 없이 시작·재개·재전송하지 않으며, CLI가 보고한 사용 한도·인증 오류는 그대로 전달하고 세션을 멈춥니다. 세션 중지, CLI 프로세스 종료, 유예 초과, 신뢰 철회 시 XIX.6.4 절차(자동 rollback 없음)로 끝내고 ADR-0005 §4.3 불변식에 따라 실행 흔적을 정리합니다."
    status: not_started
    depends_on:
