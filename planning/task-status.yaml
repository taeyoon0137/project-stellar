  - id: "XII.10.2"
    title: "가이드 열린 결정 O10을 닫는 ADR을 작성합니다. 화살표·Shift-화살표 이동 단위, 키보드 크기 조절 키, 드래그 수식키(Shift·Option·⌘·Space) 의미, 재부모화 방지 수식키, 스냅 허용 오차(화면 pt), 줌 단계와 상하한, 핸들을 숨기는 화면 크기 기준을 캔버스 명세 3·5·7·16장 제안과 비교해 정하고, 확정 수치를 가이드 12장에 기록합니다."
