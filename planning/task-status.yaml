  - id: "XXIX.2.3"
    title: "구독 CLI 실행 대상 지정을 구현합니다. 사용자가 확인한, 수정하지 않은 공식 CLI만 실행 대상으로 삼습니다(ADR-0005 §4.3 실행 대상 확인). 신원 확인 방법은 Apple 공식 문서와 각 CLI 공식 문서를 근거로 정해 보고서에 기록합니다. Stellar는 공급자 CLI를 설치·업데이트·수정하지 않습니다."
    status: not_started
    depends_on:
      - "XXIX.2.2"
    required_environments:
      - DEV-MAC
  - id: "XXIX.2.4"
    title: "macOS 실행기를 구현합니다. 실행은 ADR-0005 §4.3 두 불변식(문서 변경은 Stellar MCP tool로만, 세션은 프로젝트 working tree와 사용자의 CLI·도구 설정에 흔적 없음)을 지키고, Stellar는 자격 증명을 다루거나 들여다보지 않습니다(아키텍처 31.1, 37.3). UI가 느려도 출력 수신을 멈추지 않습니다(ADR-0005 §6). CLI 프로세스 환경은 대화형 터미널과 달리 ADR-0023 결정 9의 허용 목록으로 만듭니다. 빈 환경에서 시작해 launch profile(XXIX.2.6)의 환경 변수 이름 목록에 있는 이름만 앱 프로세스 환경에서 전달합니다. 그 밖의 실행 세부와 timeout 값은 실측, Apple 공식 문서, 각 CLI 공식 문서를 근거로 정해 보고서에 기록합니다."
    status: not_started
    depends_on:
      - "XXIX.2.2"
      - "XVIII.2.4"
      - "XVI.7.5"
    required_environments:
      - DEV-MAC
  - id: "XXIX.2.5"
    title: "구독 CLI 연결 상태를 각 CLI 공식 문서가 제공하는 방법으로만 판정합니다. CLI 자격 증명 저장 위치에는 접근하지 않습니다. 판정은 UI·Document 스레드 밖에서 하며, 판정할 수 없으면 사용 불가로 처리합니다(fail closed). CLI가 보고한 계정 식별 정보는 저장·로그·진단에 넣지 않습니다(XVI.8). 상태 정의와 판정 시점은 보고서에 기록합니다(ADR-0005 §4.1)."
    status: not_started
