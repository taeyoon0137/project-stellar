    title: "캔버스 도구 11종(`docs/design/ui/tools_menus.md` 6.2)을 코어 closed enum `CanvasTool`로 정의하고 현재 도구를 WindowViewState에 둡니다. 누르는 동안 Hand(Space), 누르는 동안 깊은 선택(⌘), Escape 복귀 같은 일시 전환을 도구 상태 기계에 넣습니다. 도구 상태는 저장·history 대상이 아닙니다(캔버스 명세 3장)."
