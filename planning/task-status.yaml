  - id: "XXX.7.2"
    title: "node에 붙는 `ContextProvision`(provider node StableId, ContextKey ref, value expression), ComponentDefinition 공개 인터페이스의 `ContextRequirement`(ContextKey ref), Slot의 공개 Context key 목록(ADR-0025 결정 3.11)을 정의합니다. provision은 소유 definition·View 안의 node에만 붙고, 자기 트리 안의 ComponentInstance node에는 붙일 수 있습니다."
