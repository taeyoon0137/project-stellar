  - id: "IX.11.21"
    title: "제품 문서 migration registry를 document와 storage에 모두 의존하는 crate(지금은 `crates/project`)에 만들고 project 열기에 연결합니다. 지금 step 등록은 test와 xtask의 noop v1→v2뿐이고(`tools/xtask/src/migration_fixtures.rs` `LATEST_SCHEMA = 2`), 제품 manifest schema는 1이며(`crates/project/src/manifest.rs` `CURRENT_SCHEMA_VERSION`), `SavedProjectLoader::open`은 migration 없이 current generation을 엽니다. storage crate는 document에 의존하지 않아 node record를 해석하지 못합니다. schema version별 payload decoder(Frame·Text 등)는 고정 사본으로 보관합니다. `FramePayload::decode`는 version 없이 잉여 bytes를 거부하므로(`crates/document/src/frame.rs`) 현재 decoder로 옛 bytes를 읽을 수 없습니다. 옛 schema 문서는 열 때 V.8.4 경로(temp generation, 검증 후 전환)로 migration하고 결과를 자동 commit하지 않습니다(아키텍처 §36, §40.4). 제품 step 번호는 test noop step과 섞이지 않게 정합니다. IX.11.6·IX.11.9·IX.11.10·IX.11.11의 schema 변경을 공개 포맷(Phase XXVIII) 전 version 증가 한 번으로 묶을지 검토하고, 결정을 착수 시 ADR로 기록합니다."
    status: not_started
    depends_on:
      - "V.8.1"
      - "V.8.4"
      - "V.8.5"
      - "V.8.6"
      - "VI.10.2"
    required_environments:
      - DEV-MAC
  - id: "IX.11.22"
    title: "합성 PropertyKey를 longhand key로 나눕니다(ADR-0024 결정 14). Frame `size`(0x0101)를 `width`·`height`로, `corner_radius`(0x0106)를 4 모서리 `border-*-radius`로, modifier `SHADOW_OFFSET`(0x1092)을 shadow offset x·y로 나누고 같은 대역의 빈 번호를 할당합니다. 기존 key는 재사용하지 않는 묶음 key로 registry에 남기고, 기존 `SetProperty` bytes와 history journal은 그대로 decode·실행합니다(결과는 longhand 전체를 설정한 것과 같음). 새 command, 인스펙터 묶음 편집, semantic snapshot(`crates/semantic-diff/src/build.rs`)과 merge는 longhand key를 씁니다. 저장된 참조(ValueBinding target, View Variant·Component variant override property patch)가 묶음 key를 가리키면 변환하지 않고 validator 진단을 냅니다. payload bytes는 바꾸지 않습니다. `transform`(0x0102)·`border`(0x0105)는 IX.11.9·IX.11.10이 같은 규칙으로 나눕니다."
    status: not_started
    depends_on:
      - "VI.3.5"
      - "VI.9.7"
      - "VII.2.4"
      - "XIV.3.1"
      - "XIV.10.2"
      - "XXV.1.1"
    required_environments:
      - DEV-MAC
  - id: "IX.11.23"
    title: "flex item 자동 최소 크기(`min-width: auto`·`min-height: auto`)를 CSS Flexbox 규칙으로 구현합니다. scroll container가 아닌 item의 main 축 최소 크기는 content 기반 최소 크기(min-content 크기를 definite max 크기로 제한한 값과 지정 크기 중 작은 값, 비율 item은 비율 변환 포함)이고, 명시한 `min-*` 값은 그대로 씁니다. min-content 측정은 intrinsic hook과 cache(X.7.2)를 씁니다. 바뀐 X.11.1 corpus 기대값은 fixture별 이유와 함께 갱신합니다."
    status: not_started
