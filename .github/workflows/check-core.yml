name: Rust core checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate pinned toolchain
        run: rustup show
      - name: Check Rust workspace
        run: cargo xtask check-core
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-core-logs
          path: target/xtask-logs/*.log
          if-no-files-found: ignore
